parameters:
- name: os
  type: string

steps:
- task: NodeTool@0
  displayName: use node $(nodeVersion)
  inputs:
    versionSpec: $(nodeVersion)

- task: NpmAuthenticate@0
  inputs:
    workingFile: .npmrc

- script: npm ci
  displayName: (task-lib) npm ci
  workingDirectory: node

- script: npm test
  workingDirectory: node
  displayName: (task-lib) npm test

# NOTE: npm publishing has been removed from this CI template.
# This template is now used for PR/CI validation only (build + test).
# Publishing the package to npmjs.org is handled by the dedicated release
# pipeline (azure-pipelines-release.yml) via the ESRP Release task.
#
# The Linux CI job still publishes the built package as the 'npm-package'
# pipeline artifact through the base template's templateContext section
# (see azure-pipelines.yml).

# Only on Windows. Build VstsTaskSdk for powershell 
- ${{ if eq(parameters.os, 'Windows_NT') }}:
  # Restore NuGet packages from internal feed (CFS compliant)
  - task: DotNetCoreCLI@2
    displayName: 'Restore .NET project(s)'
    inputs:
      command: restore
      projects: 'powershell/CompiledHelpers/VstsTaskSdk.csproj'
      feedsToUse: config
      nugetConfigPath: 'NuGet.Config'

  # Build step for .NET source code. This is needed to enable CodeQL for C# code
  - task: DotNetCoreCLI@2
    displayName: 'Build .NET project(s)'
    inputs:
      command: build
      projects: 'powershell/CompiledHelpers/VstsTaskSdk.csproj'
      arguments: '--configuration Release --no-restore'

  - task: NodeTool@0
    displayName: use node $(nodeVersionForPowershell) for PowerShell SDK
    inputs:
      versionSpec: $(nodeVersionForPowershell)

  - task: NpmAuthenticate@0
    inputs:
      workingFile: .npmrc

  - script: npm ci
    displayName: (VstsTaskSdk) npm ci
    workingDirectory: powershell

  - script: npm test
    displayName: (VstsTaskSdk) npm test
    workingDirectory: powershell
