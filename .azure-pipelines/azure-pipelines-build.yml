# =============================================================================
# Build pipeline: build, test, and PACK azure-pipelines-task-lib into a .tgz
# =============================================================================
#
# This pipeline produces the npm package tarball (.tgz) that the RELEASE
# pipeline (.azure-pipelines/azure-pipelines-release.yml) hands to ESRP for
# publication to npmjs.org. It does NOT publish anything itself.
#
#   * `npm pack` runs HERE, not in ESRP. ESRP only distributes the pre-built
#     .tgz; it never runs `npm pack`.
#   * The tarball is published as the 'npm-packages' pipeline artifact. The
#     release pipeline references THIS pipeline via `resources.pipelines` and
#     consumes that artifact as its ESRP input.
#   * The agent cannot reach the public npm registry, so all npm operations go
#     through the internal ADO feed configured in .npmrc (via NpmAuthenticate).
#
# Trigger: MANUAL. Day-to-day PR/CI validation lives in azure-pipelines.yml;
# this pipeline is run to produce a release candidate .tgz on demand.
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - name: nodeVersion
    value: '16.13.0'

# Built under the 1ES Official template (same as CI) for mseng compliance.
resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationMode: Audit
    sdl:
      sourceAnalysisPool:
        name: 1ES-ABTT-Shared-Pool
        image: abtt-windows-2025
        os: windows
    stages:
      # =======================================================================
      # Build, test, and pack in a single job. Packing from the freshly built
      # node/_build in the SAME job (no intermediate artifact round-trip) avoids
      # the 1ES SBOM (_manifest) folder that 1ES injects into published pipeline
      # artifacts -- which would otherwise be swept into the tarball by
      # `npm pack` (this package has no `files` allowlist in package.json).
      # =======================================================================
      - stage: BuildAndPack
        displayName: Build, test, and pack
        jobs:
          - job: pack
            displayName: Build & pack task-lib
            pool:
              name: 1ES-ABTT-Shared-Pool
              image: abtt-ubuntu-2404
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: 'Publish npm package (.tgz)'
                  targetPath: $(Build.ArtifactStagingDirectory)/npm-packages
                  artifactName: npm-packages
            steps:
              - task: NodeTool@0
                displayName: 'Use Node $(nodeVersion)'
                inputs:
                  versionSpec: $(nodeVersion)

              # Authenticate to the internal ADO npm feed referenced by .npmrc so
              # `npm ci` (and the idempotency `npm view` below) can reach it. The
              # agent cannot reach the public npm registry directly.
              - task: NpmAuthenticate@0
                displayName: 'Authenticate npm (.npmrc)'
                inputs:
                  workingFile: .npmrc

              - script: npm ci
                displayName: 'npm ci'
                workingDirectory: node

              - script: npm run build
                displayName: 'npm run build'
                workingDirectory: node

              - script: npm test
                displayName: 'npm test'
                workingDirectory: node

              # Guard: ESRP (and npm) cannot publish a package marked private.
              # Fail early and clearly if the built package.json has "private": true.
              - script: |
                  node -e "const p=require('./package.json'); if (p.private===true){console.error('ERROR: package.json is marked private; refusing to pack for release.');process.exit(1);} console.log('OK: '+p.name+'@'+p.version+' is publishable (private is not true).');"
                displayName: 'Validate package.json is publishable'
                workingDirectory: node/_build

              # Informational idempotency check against the internal ADO feed
              # (the agent cannot reach public npmjs). NON-FATAL: it logs a
              # warning if this exact name@version already exists so a duplicate
              # release is surfaced in the build logs before ESRP is ever run.
              # (The actual publish is a separate, manually-triggered pipeline.)
              - script: |
                  set -e
                  id=$(node -e "const p=require('./_build/package.json'); process.stdout.write(p.name+'@'+p.version)")
                  echo "Checking ADO feed for $id ..."
                  if published=$(npm view "$id" version 2>/dev/null) && [ -n "$published" ]; then
                    echo "##vso[task.logissue type=warning]$id already exists on the ADO feed; releasing it again will fail in ESRP. Bump the version before releasing."
                  else
                    echo "$id not found on the ADO feed; OK to release."
                  fi
                displayName: 'Check whether version already published (ADO feed)'
                workingDirectory: node

              # Produce the .tgz that ESRP will publish. ESRP does not pack; we
              # stage the tarball into a `packages/` SUBFOLDER of the artifact
              # ($(Build.ArtifactStagingDirectory)/npm-packages/packages) and
              # publish the parent as the 'npm-packages' artifact (see outputs).
              #
              # WHY THE SUBFOLDER: 1ES injects an SBOM `_manifest/` folder at the
              # ROOT of every published pipeline artifact. If the .tgz sat at the
              # artifact root next to `_manifest/`, the release pipeline's ESRP
              # `folderlocation` would enumerate those non-.tgz SBOM files and
              # fail trying to derive npm name@version from them (ESRP crashes
              # with "...Received undefined" while submitting the release request).
              # Keeping the .tgz in `packages/` leaves `_manifest/` a sibling, so
              # the release points ESRP at `.../npm-packages/packages` (only .tgz).
              - script: |
                  set -e
                  mkdir -p "$(Build.ArtifactStagingDirectory)/npm-packages/packages"
                  npm pack --pack-destination "$(Build.ArtifactStagingDirectory)/npm-packages/packages"
                  echo "Packed contents:"
                  ls -l "$(Build.ArtifactStagingDirectory)/npm-packages/packages"
                displayName: 'npm pack -> staging'
                workingDirectory: node/_build

              # Fail the build if npm pack produced no package files.
              - script: |
                  count=$(ls -1 "$(Build.ArtifactStagingDirectory)/npm-packages/packages"/*.tgz 2>/dev/null | wc -l)
                  echo "Found $count .tgz file(s)."
                  if [ "$count" -eq 0 ]; then
                    echo "ERROR: npm pack produced no .tgz files; nothing to release."
                    exit 1
                  fi
                displayName: 'Verify at least one .tgz exists'

              # Defense in depth: the historical `npm publish` output only ever
              # contained the package's own files -- nothing under `_manifest/`.
              # If the 1ES SBOM (or any injected artifact) ever lands INSIDE the
              # tarball, fail here rather than shipping a polluted npm package.
              - script: |
                  set -e
                  for tgz in "$(Build.ArtifactStagingDirectory)/npm-packages/packages"/*.tgz; do
                    echo "Inspecting $tgz for stray _manifest/ entries..."
                    if tar -tzf "$tgz" | grep -E '(^|/)_manifest/' ; then
                      echo "ERROR: '$tgz' contains an SBOM/_manifest folder; refusing to publish it inside the npm package."
                      exit 1
                    fi
                  done
                  echo "OK: no _manifest/ entries found inside the tarball(s)."
                displayName: 'Verify tarball has no _manifest (SBOM) inside'
